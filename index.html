<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/index.css">
    <title>Lista de tarefas</title>
</head>
<body>
    <main>
        <div id="lista-container">
            <header>

                <h2>Lista de afazeres</h2>
                <input id="textoDeTarefa" type="text" placeholder="Escreva a tarefa">
                <div class="container-btn">
                    <button id="btnAdd" type="button" >Adicionar</button>
                    <button id="btnRemov" type="button" >Remover</button>
                    <button id="btnFeito" type="button">Feito</button>
                    
                </div>

                <div id="input-prioridade">
                    <input id="cb-prioridade" name="prioridade" type="checkbox"><p>Prioridade</p>
                    <input id="cb-urgente" name="urgente" type="checkbox"><p>Urgente</p>
                </div>

            </header>
            <div class="avisos" ><div><p>Avisos: </p><span id="spanDeAvisos"></span></div><div>Feito/Remover</div></div>
            <section class="categoria-listas">
            
                <div id="lista">
                    <h4>Tarefas não feitas</h4>

                </div>
                
                <div id="prioridade">
                    <h4>Tarefas de prioridade/ urgente</h4>

                </div>
                    
                <div id="lista-feitos">
                    <h4>Tarefas concluídas</h4>

                </div>

            </section >
                


        </div>
    </main>
    <script src="./js/scripts.js"></script>
</body>
</html>
